
name: Build BOWER Android Auto APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BOWER source archive
        run: unzip -q BOWER_ANDROID_AUTO_V1_REPACKAGED.zip -d extracted

      - name: Fix Android manifest
        run: |
          cat > extracted/MvoyAuto/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="BOWER"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BowerCarAppService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.POI" />
                      </intent-filter>
                      <meta-data
                          android:name="androidx.car.app.minCarApiLevel"
                          android:value="1" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/MvoyAuto/app/build.gradle.kts")
          s = p.read_text()
          old = "android {"
          new = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if old not in s:
              raise SystemExit("Bloc android introuvable")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build debug APK
        run: gradle -p extracted/MvoyAuto assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOWER-ANDROID-AUTO-APK
          path: extracted/MvoyAuto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
