
name: BOWER Android APK

on:
  push:
    branches:
      - main
    paths:
      - "BOWER_AUTO_FIX.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BOWER Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="BOWER_AUTO_FIX.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive introuvable : $ARCHIVE"
            exit 1
          fi

          unzip -t "$ARCHIVE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q BOWER_AUTO_FIX.zip -d extracted

          PROJECT_DIR="extracted/MvoyAuto"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Projet MvoyAuto introuvable"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/MvoyAuto --no-daemon clean assembleDebug

      - name: Upload BOWER APK
        uses: actions/upload-artifact@v4
        with:
          name: BOWER-ANDROID-AUTO-APK
          path: extracted/MvoyAuto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
