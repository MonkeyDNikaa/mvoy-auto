
name: Build BOWER Android Auto APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BOWER source archive
        run: |
          unzip -q BOWER_ANDROID_AUTO_V1_REPACKAGED.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/MvoyAuto/app/build.gradle.kts")
          s = p.read_text()

          old = "android {"
          new = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if old not in s:
              raise SystemExit("Bloc android introuvable dans build.gradle.kts")

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          gradle -p extracted/MvoyAuto assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOWER-ANDROID-AUTO-APK
          path: extracted/MvoyAuto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
