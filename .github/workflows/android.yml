
name: Build BOWER Android Auto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BOWER source archive
        run: unzip -q BOWER_ANDROID_AUTO_V1.zip -d extracted

      - name: Align Java and Kotlin targets to 17
        run: |
          find extracted/MvoyAuto -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/"1\.8"/"17"/g' \
            -e "s/'1\.8'/'17'/g" {} +

      - name: Build debug APK
        run: gradle -p extracted/MvoyAuto assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOWER-ANDROID-AUTO-APK
          path: extracted/MvoyAuto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
