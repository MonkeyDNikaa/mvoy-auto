
name: Build MVOY AUTO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source archive
        run: unzip -q BOWER_ANDROID_AUTO_V1.zip -d extracted

      - name: Build debug APK
        run: gradle -p extracted/MvoyAuto assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MVOY-AUTO-APK
          path: extracted/MvoyAuto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
